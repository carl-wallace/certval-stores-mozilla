[package]
name = "certval_stores_mozilla"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
description = "Mozilla root program trust store for certval, generated from the CCADB report Mozilla publishes"
keywords = ["x509", "pki", "trust-anchor", "mozilla", "ccadb"]
categories = ["cryptography"]
license = "MPL-2.0"
repository = "https://github.com/carl-wallace/certval-stores-mozilla"
# What the build reads, plus NOTICE and the changelog: the sources, the README lib.rs takes its docs
# from, and the embedded certificates and store. tests/ is read only by the tests and tools/ only by
# the refresh, and the .der files under cas/ are the refresh's inputs for the .cbor beside them.
include = ["src/**", "README.md", "CHANGELOG.md", "roots/**/*.der", "cas/**/*.cbor", "LICENSE", "NOTICE"]

[dependencies]
# The StoreEntry type and TrustStoreProvider trait, shared with the certval_stores_* family.
certval_stores_provider_core = { git = "https://github.com/carl-wallace/certval-stores.git", version = "1.0.0-rc.1", branch = "main" }

[dev-dependencies]
# default-features = false for the same reason as the core crate: certval's
# defaults pull reqwest, and a dev-dependency taking them puts the HTTP stack
# back into the test graph however core's client features are configured, so a
# --no-default-features test run would not build the shape it claims to.
certval_stores_core = { git = "https://github.com/carl-wallace/certval-stores.git", default-features = false, features = ["test-util"], branch = "main" }
# `rsa` because most of the roots are RSA-signed: without it certval's
# signature verification returns Unrecognized rather than failing loudly, and
# the conformance suite would pass while checking nothing.
certval = { git = "https://github.com/carl-wallace/rust-pki.git", default-features = false, features = ["rsa"], branch = "main" }
# Versions tracked to certval's, so the OIDs and digests the tests use are the
# same types certval works with rather than a second copy of them.
const-oid = { version = "0.10.2", features = ["db"] }
sha2 = "0.11.0"

[features]
default = ["mozilla_tls"]
# Roots carrying the Websites trust bit — TLS server authentication. The same
# population webpki-roots serves.
mozilla_tls = []
# Roots carrying the Email trust bit — S/MIME.
mozilla_email = []
# Every root Mozilla trusts for either purpose, in one environment, for a
# consumer that validates both kinds of certificate against one anchor set.
mozilla_all = []
# Embed the intermediate-CA store: the CCADB-disclosed intermediates plus the
# precomputed partial-path graph, so paths build offline with no AIA fetch and
# no chain from a peer. Several megabytes, hence off by default. Implies `mozilla_all`
# because that is the environment it attaches to — see the provider() docs
# for why it is not offered per purpose.
mozilla_cas = ["mozilla_all"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
