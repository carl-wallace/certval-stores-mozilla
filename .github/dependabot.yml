# Dependency updates.
#
# This repository vendors its trust material, so a cargo bump here is ordinary dependency churn
# rather than a trust decision -- the roots move through `tools/refresh.py`, not through the
# lockfile. Grouped accordingly.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-crypto:
        patterns:
          - "x509-*"
          - "const-oid"
          - "der"
          - "spki"
          - "sha1"
          - "sha2"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
